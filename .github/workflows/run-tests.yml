name: Scheduled Test Suite Execution

on:
  workflow_dispatch:

# Serializes whole runs (build + deploy) so they can't overlap
concurrency:
  group: "run-tests"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push history/heatmap
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests and Generate Report
        run: python generate_report.py

      - name: Commit and Push Updated Test History
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/*.svg README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: update test history and heatmap [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "$BRANCH" \
                && git push origin "$BRANCH" && break
              echo "Push attempt $attempt failed, retrying..."
              sleep $((attempt * 5))
            done
          fi

      - name: Verify report output exists
        run: test -f public/index.html && ls -la public/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "public/"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
