[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "googletrans-test"
version = "0.1.0"
description = "Test suite and test reporting dashboard for googletrans Python package."
authors = [{ name = " Frederick Aiken" }]
dependencies = [
    "googletrans==4.0.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
requires-python = ">=3.8"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
